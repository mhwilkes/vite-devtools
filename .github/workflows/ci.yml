name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Lint, typecheck & build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        with:
          experimental: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (oxlint via vp)
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build (rolldown via vp)
        run: pnpm build
